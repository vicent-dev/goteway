# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # follows the go directive in go.mod, so CI cannot drift from it
        go-version-file: 'go.mod'

    - name: Build
      run: cp static/config.example.yaml static/config.yaml && make install && make build

    - name: Test
      run: cp static/config.example.yaml static/config.yaml && make test
