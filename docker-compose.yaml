services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: goteway
    ports:
      - 8080:8080
    environment:
      # the gateway reaches the database by service name inside the network
      DB_HOST: db
    networks:
      - goteway
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    container_name: redis
    networks:
      - goteway
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-goteway}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goteway}
      POSTGRES_DB: ${DB_NAME:-goteway}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-goteway} -d ${DB_NAME:-goteway}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - goteway

networks:
  goteway:

volumes:
  pgdata:
