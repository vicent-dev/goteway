services:
  app:
    build: docker/Dockerfile
    container_name: goteway
    ports:
      - 8080:8080
    networks:
      - goteway
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    container_name: redis
    networks:
      - goteway
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
networks:
  goteway:
